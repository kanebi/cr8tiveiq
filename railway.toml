[build]
builder = "NIXPACKS"
buildCommand = "python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"

[deploy]
startCommand = "gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 4 --timeout 120"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
