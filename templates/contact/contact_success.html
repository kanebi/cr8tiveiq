{% extends 'base.html' %}

{% block title %}Thank You - CR8TIVEIQ{% endblock %}

{% block content %}
<section class="bg-gradient-to-br from-gray-50 via-white to-white pt-40 pb-24 relative overflow-hidden">
    <div class="absolute top-20 left-10 w-72 h-72 bg-primary-blue/10 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute bottom-20 right-10 w-72 h-72 bg-accent-green/10 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
    
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center">
        <div class="bg-white rounded-2xl p-10 shadow-lg border border-gray-200">
            <div class="mx-auto mb-6 w-16 h-16 rounded-full bg-gradient-to-r from-primary-blue to-accent-green flex items-center justify-center">
                <svg viewBox="0 0 24 24" class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 6L9 17l-5-5"></path>
                </svg>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-3">Thank You!</h1>
            <p class="text-lg text-gray-600 mb-1">Your inquiry has been received successfully.</p>
            <p class="text-gray-600 mb-8">Our team will get back to you as soon as possible.</p>
            <a href="{% url 'core:home' %}" class="inline-block px-8 py-3 bg-gradient-to-r from-primary-blue to-accent-green text-white font-bold rounded-full hover:shadow-lg transition-all duration-300">
                Back to Home
            </a>
        </div>
    </div>
</section>
{% endblock %}
