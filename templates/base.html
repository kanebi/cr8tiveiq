{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CR8TIVEIQ - Digital Agency{% endblock %}</title>
    <meta name="description" content="{% block description %}CR8TIVEIQ is a modern digital agency offering creative services.{% endblock %}">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="{% block og_title %}CR8TIVEIQ - Digital Agency{% endblock %}">
    <meta property="og:description" content="{% block og_description %}CR8TIVEIQ is a modern digital agency offering creative services.{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{% endblock %}">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}CR8TIVEIQ - Digital Agency{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}CR8TIVEIQ is a modern digital agency offering creative services.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}{% endblock %}">
    
    <!-- Canonical Tag -->
    <link rel="canonical" href="{% block canonical %}{% endblock %}">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#165EFE',
                        'accent-green': '#C6FF34',
                    },
                    fontFamily: {
                        'sans': ['Montserrat', 'sans-serif'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
                        'fade-in': 'fadeIn 0.6s ease-out forwards',
                        'slide-in-left': 'slideInLeft 0.6s ease-out forwards',
                        'slide-in-right': 'slideInRight 0.6s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideInLeft: {
                            '0%': { opacity: '0', transform: 'translateX(-50px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        },
                        slideInRight: {
                            '0%': { opacity: '0', transform: 'translateX(50px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        },
                    },
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'css/dotnet.css' %}">

    <!-- Extra CSS -->
    {% block extra_css %}{% endblock %}
    
    <!-- Analytics -->
    {% include 'includes/analytics.html' %}
</head>
<body class="bg-white text-gray-900 font-sans">
    <div id="dotnet" class="dotnet" aria-hidden="true">
        <canvas id="dotnet-canvas" class="dotnet__canvas"></canvas>
    </div>

    <!-- Header -->
    {% include 'includes/header.html' %}
    
    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    {% include 'includes/footer.html' %}
    
    <!-- Scripts -->
    <script src="{% static 'js/dotnet.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/animations.js' %}"></script>
    <script src="{% static 'js/form-validation.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
